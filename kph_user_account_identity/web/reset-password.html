<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset password | KameraPH</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/kph.css">
  <link rel="stylesheet" href="css/module.css">
  <script>try{var t=localStorage.getItem("kph-theme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
  <style>
    /* Login / Register layout: no header, no footer, one centered box (uses the kit's colors only) */
    .auth { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; padding: 24px 16px; }
    .auth .kph-logo { justify-content: center; }
    .auth-card { width: 100%; max-width: 420px; padding: 28px; }
    .auth-card h1 { font-size: 22px; margin-bottom: 4px; }
    .auth-sub { color: var(--muted); margin-bottom: 16px; }
    .auth-switch { text-align: center; margin: 4px 0 0; color: var(--muted); }
    @media (max-width: 480px) { .auth-card { padding: 20px; } }
  </style>
</head>
<body data-public>
<main id="main" class="auth">
  <!-- Logo only (not a link), so nothing from the shop can be opened from here -->
  <div class="kph-logo" aria-label="KameraPH">
    <svg viewBox="0 0 40 40" aria-hidden="true"><path d="M8 13h24l-2 22H10L8 13z" fill="#FE6903"/><path d="M14 13v-2a6 6 0 0 1 12 0v2" fill="none" stroke="#FE6903" stroke-width="3"/><circle cx="20" cy="24" r="6" fill="#fff"/><circle cx="20" cy="24" r="3" fill="#272A33"/></svg>
    <span class="kph-logo-text"><span class="kph-wordmark">Kamera<b>PH</b></span><small>Capture. Create. Inspire</small></span>
  </div>

  <form id="form" class="card form auth-card">
    <div>
      <h1>Set a new password</h1>
      <p class="auth-sub">Enter the reset code and choose a new password.</p>
      <p class="test-code">No real email/SMS yet. Test code: <b>123456</b></p>
    </div>
    <div id="bad" class="alert alert-error" hidden></div>
    <div class="field" data-fields id="idfield">
      <label for="ident">Email or phone number</label>
      <input id="ident" name="Identifier" maxlength="191" autocomplete="username">
    </div>
    <div class="field" data-fields id="codefield">
      <label for="rcode">Reset code</label>
      <input id="rcode" name="Code" class="code-input" inputmode="numeric" maxlength="64" autocomplete="one-time-code" placeholder="123456">
    </div>
    <div class="field" data-fields>
      <label for="pw">New password</label>
      <input id="pw" name="Password" type="password" required autocomplete="new-password" data-password-strength>
      <div class="pw-meter" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
      <span class="pw-strength-label" aria-live="polite"></span>
      <ul class="pw-requirements">
        <li data-req="length">At least 8 characters</li>
        <li data-req="upper">One uppercase letter</li>
        <li data-req="lower">One lowercase letter</li>
        <li data-req="number">One number</li>
        <li data-req="special">One special character</li>
      </ul>
    </div>
    <div class="field" data-fields>
      <label for="pw2">Confirm new password</label>
      <input id="pw2" name="ConfirmPassword" type="password" required autocomplete="new-password" data-password-confirm="#pw">
    </div>
    <button class="btn btn-block" type="submit" data-fields>Save new password</button>
    <div id="msg" role="status"></div>
    <p class="auth-switch"><a href="forgot-password.html" id="again" hidden>Ask for a new code</a> <a href="login.html">Back to log in</a></p>
  </form>
</main>

<script src="js/config.js?v=2"></script>
<script src="js/api.js?v=2"></script>
<script src="js/demo.js?v=2"></script>
<script src="js/pw-toggle.js?v=2"></script>
<script src="js/password-strength.js?v=2"></script>
<script>
  // Live API mode enabled
  const USE_API = true;

  const qs = new URLSearchParams(location.search);
  const token = qs.get("token") || "";          // old link style (still supported)
  const idParam = qs.get("id") || "";           // new: identifier + hardcoded code
  if (idParam) document.getElementById("ident").value = idParam;
  if (token) {                                   // link style: no identifier/code fields needed
    document.getElementById("idfield").hidden = true;
    document.getElementById("codefield").hidden = true;
    document.getElementById("idfield").removeAttribute("data-fields");
    document.getElementById("codefield").removeAttribute("data-fields");
  }
  const reasons = {
    invalid: "This reset link is not valid.",
    expired: "This reset link has expired.",
    used: "This reset link was already used."
  };

  function blockForm(reason) {
    const bad = document.getElementById("bad");
    bad.hidden = false;
    bad.textContent = reasons[reason] || reasons.invalid;
    document.querySelectorAll("[data-fields]").forEach((el) => { el.hidden = true; });
    document.getElementById("again").hidden = false;
  }

  // Check the link first, so a bad link is explained right away
  if (!token) {
    // code mode: nothing to pre-check
  } else if (!USE_API) {
    const c = KPHDemo.checkResetToken(token);
    if (!c.ok) blockForm(c.reason);
  } else {
    apiGet("/password-reset.php?token=" + encodeURIComponent(token))
      .then((c) => { if (!c.ok) blockForm(c.reason); })
      .catch(() => blockForm("invalid"));
  }

  document.getElementById("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const msg = document.getElementById("msg");
    const body = Object.fromEntries(new FormData(e.target));
    if (body.Password !== body.ConfirmPassword) {
      msg.className = "alert alert-error";
      msg.textContent = "The two passwords do not match.";
      return;
    }

    if (!USE_API) {
      const r = KPHDemo.resetPassword(token, body.Password);
      if (!r.ok) { blockForm(r.reason); msg.className = ""; msg.textContent = ""; return; }
      location.href = "login.html?reset=1";
      return;
    }

    try {
      if (token) {
        await apiSend("PUT", "/password-reset.php", { Token: token, Password: body.Password });
      } else {
        if (!body.Identifier || !body.Code) {
          msg.className = "alert alert-error";
          msg.textContent = "Enter your email or phone number and the reset code.";
          return;
        }
        await apiSend("PUT", "/password-reset.php", { Identifier: body.Identifier.trim(), Token: body.Code.trim(), Password: body.Password });
      }
      location.href = "login.html?reset=1";
    } catch (err) {
      msg.className = "alert alert-error";
      msg.textContent = err.message;
    }
  });
</script>
</body>
</html>
